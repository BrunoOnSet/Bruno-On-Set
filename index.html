<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>BOS — Bruno OnSet</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar cardlike">
      <div class="top-inner bos-top-inner">
        <div class="top-title bos-top-title">
          <div class="tool-eyebrow bos-tool-eyebrow" aria-label="Bruno OnSet">
            <span class="eyebrow-logo" aria-hidden="true">BOS</span>
            <span class="eyebrow-brand" aria-label="Bruno OnSet"><span class="bos-letter">B</span>RUNO <span class="bos-letter">O</span>N<span class="bos-letter">S</span>ET</span>
          </div>
        </div>
        <div class="top-actions bos-top-actions">
          <button class="mode-btn" id="themeBtn" aria-label="Changer de thème" title="Thème">DARK</button>
          
        </div>
      </div>
    </header>



    <div class="utility-row bos-utility-row">
      <button class="utility-link" id="customizeBtn" type="button">PERSONNALISER</button>
    </div>
    <section class="context cardlike open" id="cameraCard">
      <button class="module-head context-head" id="cameraToggle" type="button">
        <span class="module-title"><i class="module-dot"></i><span><strong>CAMÉRA</strong><small id="cameraSummary">—</small></span></span>
        <span class="chev">⌄</span>
      </button>
      <div class="context-body">
        <div class="camera-choice">
          <span class="field-label">Marque</span>
          <div class="brand-chips" id="cameraBrandMode" aria-label="Choisir la marque"></div>

          <span class="field-label camera-model-label">Caméra</span>
          <div class="camera-select-wrap">
            <select class="camera-select" id="cameraSelect" aria-label="Choisir la caméra"></select>
          </div>
        </div>

        <div class="focal-block">
          <label><span>Focale</span><div class="unit-input"><input id="focalInput" type="number" inputmode="decimal" min="1" max="1000" step="1" value="35"><b>mm</b></div></label>
          <div class="preset-row" id="focalPresets" aria-label="Raccourcis focale"></div>
        </div>

        <div class="camera-shooting-grid">
          <label><span>Diaph</span><select id="globalAperture"></select></label>
          <label><span>Distance sujet</span><div class="unit-input"><input id="globalDistanceM" type="number" inputmode="decimal" min="0.30" max="50" step="0.05" value="2.50"><b>m</b></div></label>
          <label><span>Ratio</span><button type="button" class="ratio-select-btn" id="ratioBtn"><strong id="ratioText">16:9</strong><span>⌄</span></button></label>
        </div>

        <div class="camera-gamma-block">
          <span class="field-label">Gamma</span>
          <div class="gamma-chips" id="gammaMode" aria-label="Choisir la courbe gamma"></div>
          <div class="gamma-info" id="gammaInfo">—</div>
        </div>
      </div>
    </section>

    <section id="modules" class="modules" aria-live="polite"></section>

    <footer class="footer">BOS — Bruno OnSet · V28</footer>
  </main>

  <dialog id="customizeDialog" class="sheet">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head"><div><strong>Personnaliser</strong></div><button value="cancel" class="iconbtn" aria-label="Fermer">×</button></div>
      <div id="customizeList" class="custom-list"></div>
      <div class="sheet-actions"><button type="button" id="resetLayout" class="secondary">Réinitialiser</button><button value="ok" class="primary">Terminé</button></div>
    </form>
  </dialog>

  <dialog id="ratioDialog" class="sheet ratio-sheet">
    <form method="dialog" class="sheet-inner ratio-sheet-inner">
      <div class="sheet-head"><div><strong>Ratio</strong></div><button value="cancel" class="ratio-close" aria-label="Fermer">×</button></div>
      <div id="ratioList" class="ratio-choice-grid"></div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
